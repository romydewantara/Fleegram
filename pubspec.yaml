name: fleegram
description: "A simple Flutter app for sharing stories."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.1
  http: ^1.6.0
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
