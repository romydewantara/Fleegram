name: fleegram
description: "A simple Flutter app for sharing stories."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0
  go_router: ^17.0.1
  http: ^1.6.0
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  intl: ^0.20.2
  lottie: ^3.3.2
  provider: ^6.1.2
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/dicoding_logo.png
    - assets/images/ic_add_image.png
    - assets/images/ic_camera.png
    - assets/images/ic_gallery.png
    - assets/images/ic_profile.png
    - assets/lottie/banner.json
    - assets/lottie/credential.json
    - assets/lottie/error_network.json
    - assets/lottie/splash.json
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
    - family: Satisfy
      fonts:
        - asset: assets/fonts/Satisfy-Regular.ttf
